<nav
	class="sticky top-0 z-[100] flex min-h-14 items-center bg-[var(--c-bg-secondary)] shadow px-5 max-md:fixed max-md:bottom-0 max-md:top-auto max-md:w-full max-md:px-3"
>
	<ul
		class="m-0 flex w-full list-none items-center gap-2 p-0 max-md:justify-between max-md:gap-0"
	>
		<li class="inline-flex items-center">
			<a
				routerLink="/"
				class="inline-flex h-9 w-9 items-center justify-center overflow-hidden p-1 text-[var(--c-text-secondary)] no-underline"
				[attr.aria-label]="translateService.translate('Логотип')()"
			>
				<icon-spider style="--spider-w: 28px; --spider-h: 28px" />
			</a>
		</li>

		@if (sidebarToggler()) {
		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
		>
			<app-nav-icon
				routerLink="/conferences"
				[name]="viewport() === 'mobile' ? '' : conferencesLabel()"
				icon="microphone"
			/>
		</li>
		}

		<li class="mx-auto max-md:hidden"></li>

		@if (sidebarToggler()) {
		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
			(mouseleave)="onBurgerHover(false)"
			(mouseenter)="onBurgerHover(true)"
		>
			<button
				type="button"
				class="inline-flex cursor-pointer items-center justify-center border-0 bg-transparent p-2 text-[1.375rem] leading-none text-[var(--c-text-secondary)] transition-colors hover:text-[var(--c-primary)]"
				(click)="onBurgerClick()"
				[attr.aria-label]="translateService.translate('Menu')()"
			>
				<i class="pi pi-{{ burgerIcon() }}"></i>
			</button>
		</li>
		} @if (showProfile()) {
		<li
			class="inline-flex items-center max-md:flex-1 max-md:justify-center"
		>
			<app-nav-icon icon="user" routerLink="/profile" />
		</li>
		}
	</ul>
</nav>
