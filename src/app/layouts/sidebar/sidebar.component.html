@if (isMobile()) {
<button
	type="button"
	class="sidebar__backdrop fixed inset-x-0 top-0 bottom-[var(--topbar-h)]"
	[attr.aria-label]="translateService.translate('Menu')()"
	(click)="closeBackdrop($event)"
></button>
}

<aside
	class="sidebar z-[90] flex flex-col overflow-auto bg-[var(--c-bg-secondary)] p-5 shadow"
	[class.sidebar--min]="isMinimized()"
	[style.width.px]="widthPx()"
	[ngClass]="{
		'fixed right-0 top-0 bottom-[var(--topbar-h)] h-[calc(100dvh-var(--topbar-h))]': isMobile(),
		'md:fixed md:right-0 md:top-14 md:h-[calc(100dvh-56px)]': isPreview(),
		'md:sticky md:top-14 md:h-[calc(100dvh-56px)]': !isMobile() && !isPreview()
	}"
	(mouseleave)="sidebarService.disableBurgerHover = false; sidebarService.onBurgerHover(false)"
	(mouseenter)="sidebarService.disableBurgerHover = true"
>
	<div
		class="mt-1 flex items-center gap-2 rounded-[var(--radius)] px-2 py-1"
		[class]="isMinimized() ? 'justify-center' : 'justify-between'"
	>
		<a
			(click)="closeIfOverlay()"
			routerLink="/profile"
			class="inline-flex min-w-0 items-center gap-2 text-[var(--c-text-primary)] no-underline"
			[class]="isMinimized() ? 'flex-none justify-center' : 'flex-1'"
		>
			<img
				class="h-8 w-8 rounded-full"
				[src]="userService.thumb()"
				[attr.alt]="translateService.translate('User avatar')()"
				height="32"
				width="32"
			/>
			@if (showNames()) {
			<span class="truncate font-semibold" translate>Profile</span>
			}
		</a>
	</div>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Share profile')() : ''"
		[ariaLabel]="translateService.translate('Share profile')()"
		(click)="closeIfOverlay()"
		routerLink="/share-profile"
		icon="id-card"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Settings')() : ''"
		[ariaLabel]="translateService.translate('Settings')()"
		(click)="closeIfOverlay()"
		routerLink="/settings"
		icon="cog"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Feedback')() : ''"
		[ariaLabel]="translateService.translate('Feedback')()"
		(click)="closeIfOverlay()"
		routerLink="/feedback"
		icon="comment"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('For attendees')() : ''"
		[ariaLabel]="translateService.translate('For attendees')()"
		(click)="closeIfOverlay()"
		routerLink="/for-attendees"
		icon="user-plus"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('For hosts')() : ''"
		[ariaLabel]="translateService.translate('For hosts')()"
		(click)="closeIfOverlay()"
		routerLink="/for-hosts"
		icon="megaphone"
	/>

	@if (isOrganizer()) {
	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />

	@if (showNames()) {
	<div class="px-2 text-xs font-semibold tracking-wide uppercase opacity-60" translate>Для організаторів</div>
	}

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Керування лекціями')() : ''"
		[ariaLabel]="translateService.translate('Керування лекціями')()"
		(click)="closeIfOverlay()"
		routerLink="/lectures-manage"
		icon="pencil"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Мої події')() : ''"
		[ariaLabel]="translateService.translate('Мої події')()"
		(click)="closeIfOverlay()"
		routerLink="/events"
		icon="calendar"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Share Conference')() : ''"
		[ariaLabel]="translateService.translate('Share Conference')()"
		(click)="closeIfOverlay()"
		routerLink="/share"
		icon="qrcode"
	/>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />

	@if (showNames()) {
	<div class="px-2 text-xs font-semibold tracking-wide uppercase opacity-60" translate>Адміністрування</div>
	}

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Користувачі')() : ''"
		[ariaLabel]="translateService.translate('Користувачі')()"
		(click)="closeIfOverlay()"
		routerLink="/users"
		icon="users"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Форми')() : ''"
		[ariaLabel]="translateService.translate('Форми')()"
		(click)="closeIfOverlay()"
		routerLink="/forms"
		icon="file-edit"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Переклади')() : ''"
		[ariaLabel]="translateService.translate('Переклади')()"
		(click)="closeIfOverlay()"
		routerLink="/translations"
		icon="language"
	/>
	}

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />
</aside>
