<div
	class="sign min-h-dvh grid grid-rows-[30dvh_1fr] bg-[var(--c-bg-primary)] p-6 md:grid-cols-2 md:grid-rows-none md:items-stretch md:gap-16 md:p-10"
>
	<div
		class="flex h-full items-center justify-center md:justify-end md:pr-10"
	>
		<button
			(click)="themeService.nextTheme()"
			[attr.aria-label]="translateService.translate('Перемкнути тему')()"
			class="grid place-items-center rounded-xl focus-visible:outline-none focus-visible:shadow-[var(--focus-ring)]"
			type="button"
		>
			@if (logo) {
			<img
				class="block w-[min(320px,70vw)] h-auto object-contain"
				[src]="logo"
				[attr.alt]="translateService.translate('Логотип')()"
			/>
			} @else {
			<icon-spider
				class="block w-[clamp(120px,20vw,260px)] h-auto md:scale-150 md:origin-center"
			></icon-spider>
			}
		</button>
	</div>

	<div
		class="flex items-start justify-center md:items-center md:justify-start md:pl-10"
	>
		<div
			class="relative w-full max-w-[420px] rounded-[var(--radius-card)] bg-[var(--c-bg-secondary)] p-8 shadow-[var(--shadow-md)] md:p-10 border border-[var(--c-border)]"
		>
			<i
				class="pi absolute right-3 top-3 grid h-12 w-12 place-items-center text-2xl text-[var(--c-text-muted)]"
				[class.pi-sun]="themeService.mode() !== 'dark'"
				[class.pi-moon]="themeService.mode() === 'dark'"
			></i>

			<h1 class="m-0 text-2xl font-bold text-[var(--c-text-secondary)]" translate>
				Увійти / Зареєструватися
			</h1>

			<form
				(submit)="wFormSubmit(); $event.preventDefault()"
				class="mt-6"
			>
				<div class="space-y-3">
					<div>
						<input
							pInputText
							class="w-full"
							[placeholder]="translateService.translate('Введіть email...')()"
							[formField]="signForm.email"
							autofocus
							type="email"
						/>
						<app-field-error [field]="signForm.email" />
					</div>

					<div>
						<div class="relative">
							<input
								pPassword
								#passwordInput="pPassword"
								class="w-full pr-10"
								[placeholder]="translateService.translate('Введіть пароль...')()"
								[formField]="signForm.password"
								[feedback]="false"
							/>
							<button
								type="button"
								[pPasswordToggleMask]="passwordInput"
								[showLabel]="translateService.translate('Показати пароль')()"
								[hideLabel]="translateService.translate('Приховати пароль')()"
								class="absolute right-3 top-1/2 grid -translate-y-1/2 place-items-center border-0 bg-transparent p-0 text-[var(--c-text-muted)]"
							>
								<i class="pi" [class.pi-eye]="!passwordInput.visible()" [class.pi-eye-slash]="passwordInput.visible()"></i>
							</button>
						</div>
						<app-field-error [field]="signForm.password" />
					</div>

					@if (showCode()) {
					<div>
						<input
							pInputText
							class="w-full"
							[placeholder]="translateService.translate('Введіть код з пошти...')()"
							[formField]="signForm.resetPin"
							type="number"
						/>
						<app-field-error [field]="signForm.resetPin" />
					</div>
					}
				</div>

				<div class="pt-3">
					<button
						pButton
						type="submit"
						[disabled]="isSubmitDisabled()"
						class="w-full"
					>
						<span translate>Почати</span>
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
