<p-card>
	<div class="flex items-center justify-between gap-3">
		<button
			type="button"
			class="min-w-0 flex-1 cursor-pointer border-0 bg-transparent p-0 text-left"
			(click)="toggle.emit()"
		>
			<div class="truncate font-semibold">{{ lecture().title || 'Без назви' }}</div>
			<small class="opacity-70">{{ lecture().speaker }}@if (lecture().time) { · {{ lecture().time }} }</small>
		</button>
		<div class="flex items-center gap-1">
			<button pButton type="button" [text]="true" (click)="toggle.emit()">
				<i class="pi" [ngClass]="expanded() ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
			</button>
			<button pButton type="button" severity="danger" [text]="true" (click)="remove()">
				<i class="pi pi-trash"></i>
			</button>
		</div>
	</div>

	@if (expanded()) {
		<div class="mt-3 flex flex-col gap-2">
			<input pInputText [(ngModel)]="title" [placeholder]="'Назва лекції'" />
			<input pInputText [(ngModel)]="speaker" [placeholder]="'Спікер'" />
			<input pInputText [(ngModel)]="topic" [placeholder]="'Тема (тег)'" />
			<input pInputText [(ngModel)]="time" [placeholder]="'Час, напр. 10:00 — 10:45'" />
			<textarea pTextarea [(ngModel)]="description" [placeholder]="'Короткий опис'" rows="2"></textarea>
			<textarea pTextarea [(ngModel)]="content" [placeholder]="'Повний текст лекції'" rows="4"></textarea>

			<button pButton type="button" [disabled]="!hasChanges()" (click)="save()">
				<span translate>Зберегти</span>
			</button>
		</div>
	}
</p-card>
