<div class="lectures-page mx-auto flex w-full max-w-[720px] flex-col gap-3 p-3 sm:gap-4 sm:p-4">
	<button pButton type="button" [text]="true" class="self-start" routerLink="/lectures">
		<i class="pi pi-arrow-left"></i>
		<span translate>Назад до лекцій</span>
	</button>

	@if (lecture(); as lecture) {
		<p-card>
			<div class="flex flex-col gap-3 text-[var(--c-text-primary)]">
				<div class="flex flex-wrap items-center justify-between gap-2">
					<span class="text-xs font-semibold tracking-wide uppercase">
						<span translate>Лекція</span> {{ lectureNumber() }}
					</span>
					<p-tag [value]="lecture.topic"></p-tag>
				</div>

				<h1 class="m-0 text-lg leading-snug font-semibold sm:text-xl">
					<span translate>Тема:</span> {{ lecture.title }}
				</h1>

				<small>{{ lecture.speaker }} · {{ lecture.time }}</small>

				<p class="m-0 text-sm leading-relaxed">{{ lecture.content }}</p>
			</div>
		</p-card>
	} @else {
		<p-card>
			<span translate>Лекцію не знайдено.</span>
		</p-card>
	}
</div>
