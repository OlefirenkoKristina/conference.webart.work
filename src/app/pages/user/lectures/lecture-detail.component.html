<div class="lectures-page mx-auto flex h-full w-full max-w-[720px] flex-col gap-2 overflow-hidden p-3 sm:gap-3 sm:p-4">
	<button pButton type="button" [text]="true" class="shrink-0 self-start" routerLink="../">
		<i class="pi pi-arrow-left"></i>
		<span translate>Назад до лекцій</span>
	</button>

	@if (lecture(); as lecture) {
		<!-- Collapsible so it can be tucked away, leaving the chat below full-height on mobile. -->
		<div
			class="shrink-0 overflow-hidden rounded-card border border-[var(--c-border)] bg-[var(--c-bg-secondary)] shadow-[var(--shadow-sm)]"
		>
			<button
				type="button"
				class="flex w-full items-center justify-between gap-3 p-3 text-left text-[var(--c-text-primary)]"
				(click)="toggleLectureExpanded()"
			>
				<div class="min-w-0 flex-1">
					<div class="flex flex-wrap items-center gap-2">
						<span class="text-xs font-semibold tracking-wide uppercase opacity-70">
							<span translate>Лекція</span> {{ lectureNumber() }}
						</span>
						<p-tag [value]="lecture.topic"></p-tag>
					</div>
					<h1 class="m-0 mt-1 truncate text-base leading-snug font-semibold sm:text-lg">{{ lecture.title }}</h1>
					@if (lecture.speaker || lecture.time) {
						<small class="opacity-60">
							{{ lecture.speaker }}@if (lecture.speaker && lecture.time) { · }{{ lecture.time }}
						</small>
					}
				</div>
				<i
					class="pi shrink-0 opacity-70"
					[class.pi-chevron-down]="!lectureExpanded()"
					[class.pi-chevron-up]="lectureExpanded()"
				></i>
			</button>

			@if (lectureExpanded()) {
				<div class="flex flex-col gap-3 border-t border-[var(--c-border)] p-3 text-[var(--c-text-primary)]">
					<p class="m-0 text-sm leading-relaxed">{{ lecture.content }}</p>

					@if (lecture.link) {
						<a
							[href]="lecture.link"
							target="_blank"
							rel="noopener"
							class="flex items-center gap-2 self-start rounded-card border border-[var(--c-border)] p-2 text-sm"
						>
							<i class="pi pi-link"></i>
							<span translate>Перейти до лекції</span>
						</a>
					}

					@if (lecture.fileName && lecture.fileDataUrl) {
						<a
							[href]="lecture.fileDataUrl"
							[download]="lecture.fileName"
							class="flex items-center gap-2 self-start rounded-card border border-[var(--c-border)] p-2 text-sm"
						>
							<i class="pi pi-file"></i>
							<span translate>Завантажити матеріали</span>
							<span class="opacity-70">({{ lecture.fileName }})</span>
						</a>
					}
				</div>
			}
		</div>
	} @else {
		<p-card>
			<span translate>Лекцію не знайдено.</span>
		</p-card>
	}
</div>
