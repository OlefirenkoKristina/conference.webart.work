<div class="lectures-page mx-auto flex w-full max-w-[720px] flex-col gap-3 p-3 sm:gap-4 sm:p-4">
	<button pButton type="button" [text]="true" class="self-start" routerLink="/conferences">
		<i class="pi pi-arrow-left"></i>
		<span translate>Назад до конференцій</span>
	</button>

	@if (!lectures().length) {
		<p-card>
			<span translate>Лекцій поки немає.</span>
		</p-card>
	}

	@for (lecture of lectures(); track lecture._id; let i = $index) {
		<p-card [routerLink]="[lecture._id]" class="cursor-pointer">
			<div class="flex items-center justify-between gap-3 text-[var(--c-text-primary)]">
				<div class="min-w-0 flex-1">
					<span class="font-semibold">
						<span translate>Лекція</span> {{ i + 1 }}
					</span>
				</div>
				<i class="pi pi-chevron-right opacity-60"></i>
			</div>
		</p-card>
	}
</div>
