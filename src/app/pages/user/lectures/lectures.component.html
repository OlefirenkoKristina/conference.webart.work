<div class="lectures-page mx-auto flex w-full max-w-[720px] flex-col gap-3 p-3 sm:gap-4 sm:p-4">
	<div class="flex items-center justify-between gap-3">
		<h1 class="m-0 text-lg font-semibold sm:text-xl" translate>Лекції</h1>
	</div>

	@if (!lectures().length) {
		<p-card>
			<span translate>Лекцій поки немає.</span>
		</p-card>
	}

	@for (lecture of lectures(); track lecture._id; let i = $index) {
		<p-card [routerLink]="['/lectures', lecture._id]" class="cursor-pointer">
			<div class="flex flex-col gap-2 text-[var(--c-text-primary)]">
				<div class="flex flex-wrap items-center justify-between gap-2">
					<span class="text-xs font-semibold tracking-wide uppercase">
						<span translate>Лекція</span> {{ i + 1 }}
					</span>
					<p-tag [value]="lecture.topic"></p-tag>
				</div>

				<div class="text-base leading-snug font-semibold sm:text-lg">
					<span translate>Тема:</span> {{ lecture.title }}
				</div>

				<small>{{ lecture.speaker }} · {{ lecture.time }}</small>

				<p class="m-0 text-sm leading-relaxed">{{ lecture.description }}</p>
			</div>
		</p-card>
	}
</div>
