<div class="mx-auto flex w-full max-w-[720px] flex-col gap-4 p-4">
	<h1 class="m-0 text-xl font-semibold">
		<span translate>{{ isNew() ? 'Create event' : 'Edit event' }}</span>
	</h1>

	<p-card>
		<div class="text-sm font-semibold" translate>Дата та час лекції</div>
		<div class="mt-2 grid grid-cols-1 gap-3 sm:grid-cols-3">
			<div class="flex flex-1 flex-col gap-1">
				<small class="opacity-70" translate>Дата</small>
				<div class="flex flex-1">
					<input pInputText type="date" lang="uk-UA" class="h-full w-full" [(ngModel)]="date" />
				</div>
			</div>
			<div class="flex flex-col gap-1">
				<small class="opacity-70" translate>Початок</small>
				<app-time-scroll-input [(ngModel)]="startTime" class="w-full" />
			</div>
			<div class="flex flex-col gap-1">
				<small class="opacity-70" translate>Кінець</small>
				<app-time-scroll-input [(ngModel)]="endTime" class="w-full" />
			</div>
		</div>
	</p-card>

	<p-card>
		<div class="text-sm font-semibold" translate>Лекція</div>
		<div class="mt-2 flex flex-col gap-2">
			<p-select
				[options]="lectures()"
				optionLabel="title"
				optionValue="_id"
				[(ngModel)]="lectureId"
				[placeholder]="'Оберіть лекцію'"
				[showClear]="true"
				class="w-full"
			></p-select>

			@if (!isAddingLecture()) {
				<button pButton type="button" [text]="true" class="self-start" (click)="toggleAddLecture()">
					<i class="pi pi-plus"></i>
					<span translate>Додати нову лекцію</span>
				</button>
			} @else {
				<div class="flex flex-col gap-2 sm:flex-row">
					<input
						pInputText
						class="w-full"
						[(ngModel)]="newLectureTitle"
						[placeholder]="'Назва лекції'"
					/>
					<div class="flex gap-2">
						<button pButton type="button" (click)="createLecture()">
							<span translate>Додати</span>
						</button>
						<button pButton type="button" [text]="true" (click)="toggleAddLecture()">
							<span translate>Скасувати</span>
						</button>
					</div>
				</div>
			}
		</div>
	</p-card>

	<button pButton type="button" (click)="save()">
		<span translate>{{ isNew() ? 'Create' : 'Save changes' }}</span>
	</button>
</div>
